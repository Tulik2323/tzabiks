<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TULIK Logo Cube</title>
<style>
:root{
  --bg:#050b14;
  --ink:#d9f7f2;
  --sub:#6f9aa6;
  --teal:#1fd1c1;
  --green:#7be36a;
  --face:#071322;
  --cube:260px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rajdhani',system-ui,sans-serif}
.scene{
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;
  padding-inline:16px;padding-block:48px;
  background:radial-gradient(ellipse at 50% 45%,#0c2a3a 0%,var(--bg) 62%);
  overflow:hidden;
}
.stage{
  width:var(--cube);height:var(--cube);
  perspective:1100px;
  cursor:grab;touch-action:none;user-select:none;
}
.stage:active{cursor:grabbing}
.cube{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  will-change:transform;
}
.face{
  position:absolute;inset:0;
  background:var(--face);
  border:1px solid rgba(31,209,193,.45);
  box-shadow:inset 0 0 40px rgba(31,209,193,.18),0 0 24px rgba(31,209,193,.12);
  backface-visibility:hidden;
  overflow:hidden;
}
.face img,.face svg{width:100%;height:100%;display:block}
.face img{object-fit:cover}
.f-front {transform:rotateY(0deg)   translateZ(calc(var(--cube)/2))}
.f-back  {transform:rotateY(180deg) translateZ(calc(var(--cube)/2))}
.f-right {transform:rotateY(90deg)  translateZ(calc(var(--cube)/2))}
.f-left  {transform:rotateY(-90deg) translateZ(calc(var(--cube)/2))}
.f-top   {transform:rotateX(90deg)  translateZ(calc(var(--cube)/2))}
.f-bottom{transform:rotateX(-90deg) translateZ(calc(var(--cube)/2))}
.shadow{
  width:calc(var(--cube)*.9);height:28px;margin-top:-18px;
  background:radial-gradient(ellipse,rgba(31,209,193,.35) 0%,transparent 70%);
  filter:blur(6px);
}
.hint{margin:0;color:var(--sub);font-size:15px;letter-spacing:2px;text-align:center}
@media (max-width:420px){:root{--cube:200px}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500&display=swap">
</head>
<body>

<main class="scene">
  <div class="stage" id="stage" aria-label="לוגו TULIK בקובייה מסתובבת" role="img">
    <div class="cube" id="cube">
      <div class="face f-front"><img src="tk-logo.png" alt="" draggable="false"></div>
      <div class="face f-back"><img src="tk-logo.png" alt="" draggable="false"></div>
      <div class="face f-right"><img src="tk-logo.png" alt="" draggable="false"></div>
      <div class="face f-left"><img src="tk-logo.png" alt="" draggable="false"></div>
      <div class="face f-top"><img src="tk-logo.png" alt="" draggable="false"></div>
      <div class="face f-bottom"><img src="tk-logo.png" alt="" draggable="false"></div>
    </div>
  </div>
  <div class="shadow" aria-hidden="true"></div>
  <p class="hint">גרור כדי לסובב</p>
</main>

<script>
(() => {
  const cube = document.getElementById('cube');
  const stage = document.getElementById('stage');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let rx = -18, ry = 30, vx = 0, vy = reduce ? 0 : 0.35;
  const autoVy = vy;
  let dragging = false, lx = 0, ly = 0, idleSince = 0;

  const render = () => { cube.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`; };

  stage.addEventListener('pointerdown', e => {
    dragging = true; lx = e.clientX; ly = e.clientY; vx = vy = 0;
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY;
    vy = dx * 0.4; vx = -dy * 0.4;
    ry += vy; rx += vx;
    render();
  });
  const end = () => { dragging = false; idleSince = performance.now(); };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);

  const tick = (t) => {
    if (!dragging) {
      vx *= 0.95; vy *= 0.95;
      if (t - idleSince > 1200) {
        vy += (autoVy - vy) * 0.02;
        rx += (-18 - rx) * 0.02;
      }
      ry += vy; rx += vx;
      render();
    }
    requestAnimationFrame(tick);
  };
  render();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
